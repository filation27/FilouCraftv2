<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FilouCraft - Contact</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="bg-white shadow">
    <div class="max-w-6xl mx-auto py-4 px-6 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-bold text-indigo-600">FilouCraft</a>
      <nav class="space-x-4">
        <a href="index.html" class="text-sm font-medium hover:text-indigo-600">Accueil</a>
        <a href="about.html" class="text-sm font-medium hover:text-indigo-600">À propos</a>
        <a href="products.html" class="text-sm font-medium hover:text-indigo-600">Boutique</a>
        <a href="contact.html" class="text-sm font-medium hover:text-indigo-600">Contact</a>
        <a href="terms.html" class="text-sm font-medium hover:text-indigo-600">Règles / CGV</a>
      </nav>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">
    <section class="bg-white p-6 rounded shadow">
      <h1 class="text-2xl font-semibold mb-4">Contactez‑nous</h1>
      <p class="mb-4">Remplissez le formulaire ci‑dessous. Le formulaire utilise Formspree en exemple — remplacez l'URL avec votre identifiant Formspree ou votre backend.</p>
      <form action="https://formspree.io/f/your-form-id" method="POST" class="space-y-4">
        <input name="name" placeholder="Votre nom" class="w-full border rounded p-2" />
        <input name="email" type="email" placeholder="Votre e-mail" class="w-full border rounded p-2" />
        <textarea name="message" placeholder="Votre message" class="w-full border rounded p-2" rows="6"></textarea>
        <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded">Envoyer</button>
      </form>
    </section>
  </main>

  <footer class="max-w-6xl mx-auto p-6 text-sm text-gray-600">
    © 2026 FilouCraft. Tous droits réservés.
  </footer>
</body>
</html>
